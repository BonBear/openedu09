name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }}${{ matrix.experimental && ', experimental' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # The experimental macOS job may fail without failing the workflow.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12", experimental: false }
          - { os: windows-latest, python: "3.12", experimental: false }
          - { os: ubuntu-latest, python: "3.13", experimental: false }
          - { os: macos-latest, python: "3.12", experimental: true }
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libdbus-1-3 libfontconfig1
      - name: Install
        run: python -m pip install -e ".[gui,dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Pytest (hardware tests skip automatically)
        run: pytest -q

  package:
    name: package (sdist + wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Qt runtime libraries (needed to import PySide6 for edu09-gui)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libdbus-1-3 libfontconfig1
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
          ls -l dist
      - name: Install the wheel into a clean venv and smoke-test the entry points
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install "$(ls "$PWD"/dist/*.whl)[gui]"
          # Run outside the checkout so the installed package is the one under test.
          cd "$RUNNER_TEMP"
          smoke/bin/python -c "import edu09; print('edu09', edu09.__version__, edu09.__file__)"
          smoke/bin/edu09-probe --help
          smoke/bin/edu09-mcp --help
          smoke/bin/edu09-gui --help
          smoke/bin/edu09-calibrate --plan-only --fixed 5
